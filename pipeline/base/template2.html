<script>
(() => {
'use strict';
const EP = /*EP*/null;
const W = 1080, H = 1920, TOTAL = EP.total, S = EP.at;
const C = { cream:'#fff4e6', coffee:'#2a1a14', orange:'#ff7a3d', yellow:'#ffd23f', red:'#ff4d4d', green:'#5ad17a', blue:'#5aa9ff', pink:'#ff6fa3' };

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');

/* ============ LIENZO PIXEL (135 x 240, se amplía x8) ============ */
const LW = 135, LH = 240;
const low = document.createElement('canvas'); low.width = LW; low.height = LH; const L = low.getContext('2d');

  if (!o.night) { R(34, 40, 6, 6, '#fff3b0'); }

  R(2, 31, 48, 2, '#1c1d38');

    for (let i = 0; i < 9; i++) { const k = (t * .05 + i * .137) % 1; R(20 + i * 6 + Math.sin(t + i) * 3, 60 + k * 150, 1, 1, 'rgba(255,250,220,.7)'); } }

    const night = t < S.door, open = t >= S.door && t < S.slam ? eout(clamp(doorD / .15)) : 0;
    room(t, { night, door: open, jolt });
    const mom = t >= S.door + .12 && t < S.slam;
    if (mom) person(93, 172, PM, { expr: 'angry', talk: talks(t, 'MAMÁ'), blink: bl, armL: 'hip', armR: 'up', broom: Math.sin(t * 14) * 1.5, bob: talks(t, 'MAMÁ') ? Math.round(Math.sin(t * 16) * .6) : 0 });
    if (t < S.door) brayanBed(t, { expr: tb ? 'tired' : 'tired', talk: tb, blink: bl, phone: true });
    else brayanBed(t, { sit: true, expr: slamD > 0 ? 'sad' : 'surprised', sweat: t, blink: slamD > 0 && bl });
    if (t < S.door) { cam = { x: lerp(67, 44, eio(clamp(t / S.door))), y: lerp(120, 150, eio(clamp(t / S.door))), z: lerp(1.0, 1.55, eio(clamp(t / S.door))) }; dark = .34; }
    else if (t < S.mom2) cam = { x: 67, y: 128, z: lerp(1.0, 1.1, clamp(doorD / 3)) };
    else if (t < S.slam) cam = { x: 93, y: 146, z: 2.7 };
    else cam = { x: 22, y: 130, z: lerp(2.6, 3.0, eio(clamp(slamD / 1))) };
    if (doorD >= 0 && doorD < .3) shake = 14 * (1 - doorD / .3);
    if (slamD >= 0 && slamD < .35) shake = 18 * (1 - slamD / .35);
  } else {
    room(t, { noBlanket: false, jolt: 0 });
    let ex = 'sad', o = {};
    if (t < S.chat) ex = 'sad'; else if (t < S.sad) ex = 'surprised'; else if (t < S.screen) { ex = 'sad'; o.tear = t; }
    else if (t < S.del) ex = 'tired'; else if (t < S.you) ex = 'determined'; else if (t < S.you + 1.5) ex = 'sad'; else if (t < S.poll) ex = 'determined'; else ex = Math.floor(t * 1.3) % 2 ? 'happy' : 'neutral';
    const up = t >= S.poll ? Math.abs(Math.sin(t * 5)) * 2 : 0;
    person(52, 200 - Math.round(up), PB, { expr: ex, talk: tb, blink: bl, bob: bB, armR: t >= S.you + 1.5 && t < S.poll ? 'point' : (t >= S.del + .5 && t < S.you ? 'up' : undefined), ...o });
    if (t < S.you) cam = { x: lerp(56, 52, eout(clamp((t - S.stand) / 1.2))), y: 172, z: lerp(1.6, 2.0, eout(clamp((t - S.stand) / 1.2))) };
    else if (t < S.poll) cam = { x: 52, y: lerp(172, 178, eout(clamp((t - S.you) / .6))), z: lerp(2.0, 4.2, eout(clamp((t - S.you) / .6))) };
    else cam = { x: 52, y: 150, z: 2.2 };
  }
  blit(cam, shake, t);
  if (dark) { ctx.fillStyle = `rgba(12,10,40,${dark})`; ctx.fillRect(0, 0, W, H); const gz = cam.z, gx = (18 - (cam.x - LW / gz / 2)) * 8 * gz + 60, gy = (128 - (cam.y - LH / gz / 2)) * 8 * gz; const g = ctx.createRadialGradient(gx, gy, 10, gx, gy, 330 * gz); g.addColorStop(0, 'rgba(150,205,255,.42)'); g.addColorStop(1, 'rgba(150,205,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 200, 900, 1200);
    for (let i = 0; i < 3; i++) { const k = (t * .7 + i / 3) % 1; ctx.globalAlpha = 1 - k; ctx.fillStyle = [C.red, C.blue, C.yellow][i]; rrect(gx + 90 + i * 40, gy - 60 - k * 200, 28, 28, 8); ctx.fill(); } ctx.globalAlpha = 1; }
  vignette(.45);

  // --- capas en alta resolución ---
  if (t >= S.door && t < S.slam) { // líneas de grito
    const k = clamp(doorD / .2); if (doorD < .5) { ctx.save(); ctx.globalAlpha = 1 - doorD / .5; ctx.font = `700 150px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.translate(540, 520); ctx.rotate(-.08); ctx.scale(lerp(.6, 1.15, k), lerp(.6, 1.15, k)); outlined('¡PUM!', 0, 0, C.yellow, 20); ctx.restore(); }
  }
  if (slamD >= 0 && slamD < .6) { ctx.save(); ctx.globalAlpha = 1 - slamD / .6; ctx.font = `700 150px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.translate(560, 520); ctx.rotate(.07); outlined('¡PAM!', 0, 0, C.red, 20); ctx.restore(); }
  if (t >= S.stand && t < S.chat) { const d = t - S.stand - .3; if (d > 0) { const k = eback(clamp(d / .35)); icon('alarm', 540, 480 + (d < 1.3 ? Math.sin(d * 40) * 8 : 0), 26 * k, 1, d < 1.3 ? Math.sin(d * 50) * .09 : 0); stamp('DESPEDIDO', 540, 700, C.red, -.1, clamp((d - 1.2) / .6)); } }
  if (t >= S.chat && t < S.sad) { ctx.fillStyle = 'rgba(14,10,24,.72)'; ctx.fillRect(0, 0, W, H); chat(t); }
  if (t >= S.sad && t < S.screen) { const d = t - S.sad; icon('heartL', 470 - Math.min(40, d * 60), 480, 34, 1, -Math.min(.3, d * .5)); icon('heartR', 620 + Math.min(40, d * 60), 490, 34, 1, Math.min(.3, d * .5)); stamp('BLOQUEADO', 540, 700, C.red, .08, clamp((d - .5) / .6)); }
  if (t >= S.screen && t < S.del) screenTime(t, S.screen);
  if (t >= S.del && t < S.you) deleteApps(t, S.del);
  if (t >= S.you && t < S.poll) { const k = eback(clamp((t - S.you - 1.7) / .4)); if (k > 0) { ctx.save(); ctx.translate(540, 420); ctx.scale(k, k); ctx.rotate(-.04); ctx.fillStyle = 'rgba(0,0,0,.35)'; rrect(-420, -86, 860, 190, 26); ctx.fill(); rrect(-430, -95, 860, 190, 26); ctx.fillStyle = C.orange; ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = C.coffee; ctx.stroke();
    ctx.fillStyle = C.coffee; ctx.font = `700 100px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('USTEDES DECIDEN', 0, 6); ctx.restore(); } }
  if (t >= S.poll) poll(t);
  header(t);
  caption(t);
  for (const tt of [S.stand, S.chat, S.sad, S.del, S.you, S.poll, S.mom2]) { const d = t - tt; if (d >= 0 && d < .16) { ctx.fillStyle = `rgba(255,244,230,${.45 * (1 - d / .16)})`; ctx.fillRect(0, 0, W, H); } }
}
drawValeAvatar();
window.renderAt = render; window.TOTAL = TOTAL;

/* ============ REPRODUCCIÓN ============ */
const snd = document.getElementById('snd'), playBtn = document.getElementById('play'), restartBtn = document.getElementById('restart');
const clock = document.getElementById('clock'), fill = document.getElementById('fill'), stage = document.getElementById('stage'), frame = document.getElementById('frame');
let raf = 0, startPerf = 0, useAudio = true, running = false;
const now = () => useAudio && !snd.paused ? snd.currentTime : (performance.now() - startPerf) / 1000;
function loop() { const t = Math.min(TOTAL, now()); render(t); clock.textContent = `${t.toFixed(1)} / ${TOTAL.toFixed(0)} s`; fill.style.width = (t / TOTAL * 100) + '%';
  if (t >= TOTAL || (useAudio && snd.ended)) { running = false; playBtn.textContent = '↻ VER DE NUEVO'; playBtn.hidden = false; render(TOTAL); return; } raf = requestAnimationFrame(loop); }
function start() { cancelAnimationFrame(raf); playBtn.hidden = true; running = true; snd.currentTime = 0; startPerf = performance.now(); useAudio = true;
  const p = snd.play(); if (p && p.catch) p.catch(() => { useAudio = false; startPerf = performance.now(); }); raf = requestAnimationFrame(loop); }
playBtn.addEventListener('click', start); restartBtn.addEventListener('click', start);
function fitStage() { const h = Math.max(120, Math.min(stage.clientHeight, stage.clientWidth * 16 / 9)); frame.style.height = h + 'px'; frame.style.width = (h * 9 / 16) + 'px'; }
window.addEventListener('resize', fitStage); fitStage();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (!running) render(6.5); });
render(6.5);
})();
